<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KFS Padel — Admin</title>
<meta name="theme-color" content="#0a2b2c">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="shell">
  <div class="wordmark">
    <span class="dot"></span>
    <span>KFS PADEL — ADMIN</span>
  </div>

  <!-- ===================== GATE VIEW ===================== -->
  <div class="card" id="view-gate">
    <h1>دخول الأدمن</h1>
    <p class="sub">الصفحة دي خاصة بالأدمن بس.</p>
    <div class="msg error" id="gate-error"></div>
    <form id="gate-form">
      <div class="field">
        <label for="gate-pass">باسورد الأدمن</label>
        <input type="password" id="gate-pass" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary">دخول</button>
    </form>
  </div>

  <!-- ===================== ADD PLAYER VIEW ===================== -->
  <div class="admin-wrap hidden" id="view-admin">

    <div class="card admin-card">
      <h1>إضافة لاعب جديد</h1>
      <p class="sub">هيتولد كود وباسورد تلقائي — انسخهم وابعتهم للاعب على واتساب.</p>

      <div class="msg error" id="add-error"></div>
      <div class="msg success" id="add-success"></div>

      <form id="add-form">
        <div class="field">
          <label for="ap-name">اسم اللاعب</label>
          <input type="text" id="ap-name" required placeholder="محمد أحمد">
        </div>
        <div class="field">
          <label for="ap-phone">رقم الموبايل</label>
          <input type="tel" id="ap-phone" required placeholder="01xxxxxxxxx">
        </div>
        <div class="field">
          <label for="ap-tier">المستوى المبدئي</label>
          <select id="ap-tier">
            <option value="bronze_3">برونزي 3 (مبتدئ)</option>
            <option value="bronze_2">برونزي 2</option>
            <option value="bronze_1">برونزي 1</option>
            <option value="silver_3" selected>فضي 3</option>
            <option value="silver_2">فضي 2</option>
            <option value="silver_1">فضي 1</option>
            <option value="gold_3">ذهبي 3</option>
            <option value="gold_2">ذهبي 2</option>
            <option value="gold_1">ذهبي 1</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" id="add-btn">إضافة اللاعب وتوليد الكود</button>
      </form>
    </div>

    <div class="card admin-card hidden" id="credentials-card" style="margin-top:16px;">
      <h1>بيانات الدخول</h1>
      <p class="sub">ابعت البيانات دي للاعب — مش هتتعرض تاني بعد كدا.</p>
      <div class="field">
        <label>الكود</label>
        <div class="code-tag" id="new-code">—</div>
      </div>
      <div class="field">
        <label>الباسورد</label>
        <div class="code-tag" id="new-pass">—</div>
      </div>
      <button class="btn btn-ghost" id="copy-creds" type="button">نسخ الرسالة الجاهزة للواتساب</button>
    </div>

    <div class="card admin-card" style="margin-top:16px;">
      <h1>كل اللاعبين</h1>
      <div id="players-loading" style="font-size:13px; color:var(--ink-soft);">
        <span class="spinner"></span> جاري التحميل...
      </div>
      <table class="players hidden" id="players-table">
        <thead>
          <tr>
            <th>الاسم</th>
            <th>الكود</th>
            <th>المستوى</th>
            <th>النقط</th>
            <th>ماتشات</th>
          </tr>
        </thead>
        <tbody id="players-tbody"></tbody>
      </table>
    </div>

    <div class="foot-link" style="margin-top:16px;">
      <button class="link-btn" id="admin-logout" type="button" style="color:var(--white); opacity:.8;">خروج</button>
    </div>
  </div>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
